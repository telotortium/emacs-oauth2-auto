name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - "26.1"
          - "26.3"
          - "27.2"
          - "28.2"
          - "29.2"
          - "30.1"
          - "snapshot"
        cask_version:
          - "0.9.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Emacs
        uses: purcell/setup-emacs@11969ffc35972d0aa1a439489e99b4b61a60917c
        with:
          version: ${{ matrix.emacs_version }}

      - name: Install Cask
        uses: cask/setup-cask@4e417b59c4ebfb4d5730072f4f265b0ca02cfed4
        with:
          version: ${{ matrix.cask_version }}

      - name: Add Cask to PATH
        run: echo "$HOME/.cask/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: make elpa

      - name: Compile
        run: make compile

      - name: Test
        run: make test
